<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="248" viewBox="0 0 1200 248" role="img" aria-labelledby="title desc">
<title id="title">Duplicates by S1mplee67 — animated photo comparison diagram</title><desc id="desc">Conceptual animated diagram: two photos are scanned, muted signals travel to a local aHash, dHash and RGB comparison, and the progress meter fills before restarting. Illustrative visualization, not a live application screenshot.</desc>
<defs>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8DA6A0" stroke-opacity=".09"/></pattern>
<clipPath id="clipA"><rect x="95" y="89" width="165" height="83" rx="3"/></clipPath>
<clipPath id="clipB"><rect x="940" y="89" width="165" height="83" rx="3"/></clipPath>
<linearGradient id="scan"><stop stop-color="#A6CDBE" stop-opacity="0"/><stop offset=".5" stop-color="#A6CDBE" stop-opacity=".35"/><stop offset="1" stop-color="#A6CDBE" stop-opacity="0"/></linearGradient>
</defs>
<style>
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes breathe{0%,100%{stroke-opacity:.58}50%{stroke-opacity:1}}
@keyframes cursor{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes slightFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.stream{stroke-dasharray:9 7;animation:flow 2.8s linear infinite}
.compare{animation:breathe 4.2s ease-in-out infinite}
.status{animation:cursor 3.8s ease-in-out infinite}
.photo{animation:slightFloat 7s ease-in-out infinite}
.photo.b{animation-delay:-3.5s}
.still-meter{display:none}
@media(prefers-reduced-motion:reduce){.stream,.compare,.status,.photo{animation:none}.motion-only{visibility:hidden}.still-meter{display:inline}}
</style>
<rect width="1200" height="248" rx="10" fill="#182125"/><rect width="1200" height="248" rx="10" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="246" rx="9" fill="none" stroke="#3D5552"/>
