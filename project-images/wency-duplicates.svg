<path d="M95 92h165" stroke="#BCDACC" stroke-width="1.6" stroke-opacity=".68"><animateTransform attributeName="transform" type="translate" values="0 -3;0 -3;0 69;0 69;0 -3" keyTimes="0;.12;.77;.89;1" dur="5.8s" repeatCount="indefinite"/></path>
</g>
